[app]
framework = "Flask"
version = "flask 3.1.3, flask-smorest 0.47.0, flask-sqlalchemy 3.1.1, sqlalchemy 2.0.51, pyjwt 2.13.0"
language = "Python 3.14.5"
openapi_path = "/openapi.json"

authored = [
    "app.py",
    "templates/base.html",
    "templates/bookmarks.html",
]

# class Base + pass (2), app = Flask (1), six app.config lines (6),
# db = SQLAlchemy (1), api = Api (1), blp = Blueprint (1),
# api.register_blueprint (1).
wiring_lines = 13

packages_added = ["flask-sqlalchemy", "pyjwt", "flask-smorest"]

notes = """
Three direct additions pull 13 more transitively: 17 distributions in total
against Flask's own 7.

Stack chosen per readme rule 3 (idiomatic) with the trade recorded, because
no single Flask stack is both leanest in packages and leanest in code:

- Measured alternative: apiflask instead of flask-smorest gives terser route
  code but costs 26 distributions and 26.2 MB — 9 more packages and 8.3 MB.
  Not built, so it has no line count here.
- Leaner alternative not built: stdlib sqlite3 instead of flask-sqlalchemy
  drops three packages (flask_sqlalchemy, sqlalchemy, greenlet) at the cost of
  hand-written SQL and row-to-dict mapping.

Work Flask needs that Tina4 did not:

- Auth is hand-rolled. A token_required decorator, header parsing, and
  jwt.decode in a try/except — 12 lines that exist only because non-GET routes
  are open by default.
- Token issuing is hand-rolled: payload dict, expiry arithmetic, jwt.encode.
- OpenAPI needs six config lines before the spec is served at all. Without
  OPENAPI_URL_PREFIX the document is generated but unreachable — /openapi.json
  returned 404 until it was set.
- The Swagger UI is loaded from a jsdelivr CDN (OPENAPI_SWAGGER_UI_URL), so the
  docs page does not work offline. Tina4 serves its own.
- Routes must be documented through marshmallow schemas to appear in the spec,
  so BookmarkSchema and LoginSchema exist purely for OpenAPI.
- Bookmark.to_dict() is hand-written; there is no ORM serialiser.
- Routes go on a Blueprint that is registered with the Api object, rather than
  being discovered.
"""

[edited]

[install]
# Measured on a clean venv, before the app was ever run (readme rule 6).
# 3 direct additions pull 13 transitively.
measured_before_first_run = true
distributions = 17
size_mb = 17.9
