[project]
name = "debug-false-mockapp"
version = "0.1.0"
description = "Repro app for the TINA4_DEBUG=false / dev-footer / route-count findings"
# Mirrors the official `tina4 init python` scaffold. Do not relax to >=3.11 —
# uv then resolves the ancient v2-era tina4-python 0.2.85 for the 3.11 fork,
# which has no `tina4_python.core` module and fails at import.
requires-python = ">=3.12"
dependencies = [
    "tina4-python>=3.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
